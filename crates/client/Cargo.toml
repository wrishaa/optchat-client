[package]
name = "optchat-client"
edition.workspace = true
version.workspace = true

# The engine client without UI (shared by the macOS and iOS apps): connections (one socket per engine), the app
# state and its reducer (a GPUI entity, no views), rpc, reconnect, tokens (in the shell's secure store), dictation audio.
# No OS APIs here: OS features come through optchat-platform (implemented by the shells).
[dependencies]
gpui.workspace = true
optchat-proto.workspace = true
optchat-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64.workspace = true
uuid.workspace = true
image.workspace = true
cpal.workspace = true
libc.workspace = true

# Android ships its TLS implementation with the client; desktop/Apple keep native trust.
[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
