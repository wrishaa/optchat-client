[package]
name = "optchat-client"
edition.workspace = true
version.workspace = true

# The engine client without UI (shared by the macOS and iOS apps): connections (one socket per engine), the app
# state and its reducer (a GPUI entity, no views), rpc, reconnect, tokens (in the shell's secure store), dictation audio.
# No OS APIs here: OS features come through optchat-platform (implemented by the shells).
[dependencies]
gpui.workspace = true
optchat-proto.workspace = true
optchat-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# lan-first (lan.rs): the pinned lan connection (system TLS, SPKI pin checked before the first byte) and HTTP over it
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64.workspace = true
uuid.workspace = true
image.workspace = true
cpal.workspace = true
libc.workspace = true

[dev-dependencies]
# tests/lan_live.rs: the real bonjour browse + path monitor on the Mac
optchat-platform = { workspace = true, features = ["apple-net"] }
