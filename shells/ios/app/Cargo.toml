# OptChat for iPhone and iPad: the shared client and UI (crates/client + crates/ui, the same code as the macOS app)
# in an iOS shell, on the workspace's one GPUI (vendor/zed: tools/zed-vendor.sh). A member of the root workspace;
# built by build.sh (called from OptChat.xcodeproj's script phase) for an iOS target.
[package]
name = "optchat-ios"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "optchat-ios"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui_ios.workspace = true
optchat-platform = { workspace = true, features = ["apple-keychain"] }
optchat-client = { workspace = true, features = ["cpal"] }
optchat-ui.workspace = true
tokio.workspace = true
serde_json.workspace = true
base64.workspace = true
objc2 = "0.6"
mach2 = "0.6"
libc.workspace = true
