optchat-ui.workspace = true
optchat-platform.workspace = true
tokio.workspace = true
serde_json.workspace = true
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
log.workspace = true
