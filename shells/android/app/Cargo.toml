[package]
name = "optchat-android"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "optchat_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
gpui.workspace = true
gpui-mobile = { path = "../../../vendor/gpui-mobile", default-features = false }
