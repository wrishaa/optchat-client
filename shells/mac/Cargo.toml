[package]
name = "optchat-mac"
edition.workspace = true
version.workspace = true

# OptChat for macOS: the shared UI (optchat-ui) in a thin shell, plus the macOS Platform (Keychain, memory, test QR).
[[bin]]
name = "OptChat"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["runtime_shaders", "font-kit"] }
optchat-platform = { workspace = true, features = ["apple-keychain"] }
optchat-ui.workspace = true
optchat-client = { workspace = true, features = ["cpal"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
libc.workspace = true
