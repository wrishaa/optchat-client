[workspace]
resolver = "2"
members = ["crates/proto", "crates/theme", "crates/platform", "crates/client", "crates/ui", "shells/mac", "shells/linux", "shells/windows", "shells/ios/app", "shells/android/app"]
# Root builds are portable: build shared crates by default, select the native shell with
# cargo run -p optchat-linux / optchat-mac / optchat-windows. The iOS build script selects its own target.
# vendor/zed is zed's own workspace (path deps under the root would otherwise join this one)
exclude = ["vendor", "vendor/gpui-mobile", "third_party/native-tls"]
default-members = ["crates/proto", "crates/theme", "crates/platform", "crates/client", "crates/ui"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
log = "0.4"
libc = "=0.2.186" # one pin for every shell (the iOS build needed it)
cpal = "0.16"
# The Linux shell shares its Secret Service client and executor with GPUI.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
smol = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
optchat-proto = { path = "crates/proto" }
optchat-theme = { path = "crates/theme" }
optchat-platform = { path = "crates/platform" }
optchat-client = { path = "crates/client" }
optchat-ui = { path = "crates/ui" }
# GPUI: one pin for every platform. zed-industries/zed branch gpui-ios-platform (zed#63068) at 97dc71d; the crates
# resolve to vendor/zed (below), a git submodule at that commit, with patches/zed/*.patch applied by tools/zed-vendor.sh.
gpui = { git = "https://github.com/zed-industries/zed", rev = "97dc71d8b8f79012c1441aa01121fba95667292a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "97dc71d8b8f79012c1441aa01121fba95667292a" }
gpui_ios = { git = "https://github.com/zed-industries/zed", rev = "97dc71d8b8f79012c1441aa01121fba95667292a" }

# Every zed crate GPUI pulls in comes from vendor/zed (git clone --recursive, then tools/zed-vendor.sh).
[patch."https://github.com/zed-industries/zed"]
collections = { path = "vendor/zed/crates/collections" }
derive_refineable = { path = "vendor/zed/crates/refineable/derive_refineable" }
gpui = { path = "vendor/zed/crates/gpui" }
gpui_apple = { path = "vendor/zed/crates/gpui_apple" }
gpui_ios = { path = "vendor/zed/crates/gpui_ios" }
gpui_linux = { path = "vendor/zed/crates/gpui_linux" }
gpui_macos = { path = "vendor/zed/crates/gpui_macos" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform" }
gpui_shared_string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui_util = { path = "vendor/zed/crates/gpui_util" }
gpui_web = { path = "vendor/zed/crates/gpui_web" }
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }
gpui_windows = { path = "vendor/zed/crates/gpui_windows" }
http_client = { path = "vendor/zed/crates/http_client" }
refineable = { path = "vendor/zed/crates/refineable" }
scheduler = { path = "vendor/zed/crates/scheduler" }
sum_tree = { path = "vendor/zed/crates/sum_tree" }
ztracing = { path = "vendor/zed/crates/ztracing" }
ztracing_macro = { path = "vendor/zed/crates/ztracing_macro" }

# the zed workspace's crates.io patches that GPUI's dependency graph needs
[patch.crates-io]
native-tls = { path = "third_party/native-tls" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[profile.release-lite]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
debug = false
strip = true

# iOS release builds (shells/ios/app/build.sh): line tables for dSYMs, abort on panic
[profile.release-ios]
inherits = "release"
debug = "line-tables-only"
panic = "abort"
